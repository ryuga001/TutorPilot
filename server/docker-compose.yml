services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutorpilot
      POSTGRES_PASSWORD: tutorpilot
      POSTGRES_DB: tutorpilot
    ports:
      - "5432:5432"
    volumes:
      - tutorpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorpilot -d tutorpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tutorpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: tutorpilot-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: tutorpilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tutorpilot_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: tutorpilot-livekit
    restart: unless-stopped

    command:
      - --config
      - /etc/livekit/livekit.yml

    volumes:
      - ./livekit/livekit.yml:/etc/livekit/livekit.yml:ro

    # The API runs on the host (not in this compose network); livekit.yml's
    # webhook.urls points at host.docker.internal, which on Linux only
    # resolves with this mapping (Docker Desktop provides it natively).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

    depends_on:
      redis:
        condition: service_healthy

  egress:
    image: livekit/egress:latest
    container_name: tutorpilot-egress
    restart: unless-stopped

    # Room-composite egress renders the room in headless Chrome, which needs
    # its sandbox; without SYS_ADMIN the recording fails immediately.
    cap_add:
      - SYS_ADMIN

    # The API hands egress a MinIO endpoint (MINIO_ENDPOINT) as the upload
    # target; if that's set to "localhost:9000" it resolves inside this
    # container to itself, not the host's MinIO. Point MINIO_ENDPOINT (the
    # Go API's env) at host.docker.internal:9000 instead, and this mapping
    # makes that name resolvable here too.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      EGRESS_CONFIG_BODY: |
        api_key: tutorpilot
        api_secret: sdfsfd4f7c2d9a1b8e5f6a3c7d9e2f4b6a8c1ddfsafdsadf
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        insecure: true

    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

volumes:
  tutorpilot_pgdata:
  tutorpilot_miniodata:
