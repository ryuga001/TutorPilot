services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutorpilot
      POSTGRES_PASSWORD: tutorpilot
      POSTGRES_DB: tutorpilot
    ports:
      - "5432:5432"
    volumes:
      - tutorpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorpilot -d tutorpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tutorpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: tutorpilot-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  tutorpilot_pgdata:
