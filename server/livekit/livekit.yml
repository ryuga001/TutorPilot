port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882

keys:
  tutorpilot: sdfsfd4f7c2d9a1b8e5f6a3c7d9e2f4b6a8c1ddfsafdsadf

logging:
  level: info

# Egress workers register with livekit-server over Redis; without this block,
# StartRoomCompositeEgress calls sit with no worker to pick them up.
redis:
  address: redis:6379

# Delivered to the Go API's /api/v1/webhooks/livekit route, which is what
# advances recording_status and closes attendance rows. The API runs on the
# host, not in this compose network, so host-gateway is required to reach it.
webhook:
  api_key: tutorpilot
  urls:
    - http://host.docker.internal:8080/api/v1/webhooks/livekit